# Keeps the free Supabase project awake. Supabase pauses Free Plan projects
# after 7 days without activity; this sends one small read request every 3 days.
# It only reads the public site_settings row, using the public (publishable) key.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC every 3 days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(node -e "import('./src/config.mjs').then(m=>console.log(m.site.supabaseUrl))")
          KEY=$(node -e "import('./src/config.mjs').then(m=>console.log(m.site.supabaseAnonKey))")
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/site_settings?select=id" -H "apikey: $KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not respond. The project may be paused — restore it at https://supabase.com/dashboard"
            exit 1
          fi
